name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and check browser interfaces
        run: npm run test:ui

      - name: Build CDN font variant
        run: npm run build:cdn-fonts

      - name: Check local and CDN fonts
        run: npm run test:fonts

      - name: Package and verify release archives
        run: npm run zip && npm run check:release && npm run zip:cdn-fonts && npm run check:release:cdn-fonts

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miboard-${{ github.sha }}
          path: |
            dist.zip
            dist.zip.sha256
            dist-cdn-fonts.zip
            dist-cdn-fonts.zip.sha256
          if-no-files-found: error
          retention-days: 7
