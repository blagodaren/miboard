name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and verify (for example, v0.1.9)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify tag and prepare release notes
        id: metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'

          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/)
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.json version')

          const sections = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)
          const section = sections.find(value => value.startsWith(`[${version}]`))
          assert.ok(section, `Missing CHANGELOG entry for ${version}`)
          const notes = section.slice(section.indexOf('\n') + 1).trim()
          assert.ok(notes, 'Release notes must not be empty')
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and check browser interfaces
        run: npm run test:ui

      - name: Build CDN font variant
        run: npm run build:cdn-fonts

      - name: Check local and CDN fonts
        run: npm run test:fonts

      - name: Package and verify release archives
        run: npm run zip && npm run check:release && npm run zip:cdn-fonts && npm run check:release:cdn-fonts

      - name: Publish or verify GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != "false" ]]; then
              echo "::error::An unpublished draft already exists for $RELEASE_TAG"
              exit 1
            fi
            published="$RUNNER_TEMP/published-release"
            gh release download "$RELEASE_TAG" --dir "$published" \
              --pattern dist.zip --pattern dist.zip.sha256 \
              --pattern dist-cdn-fonts.zip --pattern dist-cdn-fonts.zip.sha256
            node scripts/check-release.mjs dist "$published/dist.zip"
            node scripts/check-release.mjs dist-cdn-fonts "$published/dist-cdn-fonts.zip" --cdn-fonts
            echo "Verified published $RELEASE_TAG archives against the rebuilt distributions."
            exit 0
          fi
          args=(
            "$RELEASE_TAG"
            dist.zip
            dist.zip.sha256
            dist-cdn-fonts.zip
            dist-cdn-fonts.zip.sha256
            --verify-tag
            --title "MIBoard $VERSION"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"
